name: Build LengLengLiquidNotice DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build rootless DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git clang make perl unzip

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Build rootless DEB
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: LengLengLiquidNotice-DEB
          path: packages/*.deb
          if-no-files-found: error
