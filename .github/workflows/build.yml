name: Build LengLengLiquidNotice DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build rootless DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            zip \
            git \
            libxml2 \
            xz-utils

      - name: Install Theos
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -L \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/iOSToolchain.tar.xz
          tar -xJf /tmp/iOSToolchain.tar.xz -C "$THEOS/toolchain"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS.sdk.tar.xz -C "$THEOS/sdks"

      - name: Check Theos environment
        run: |
          echo "THEOS=$THEOS"
          ls -la "$THEOS/sdks"
          ls -la "$THEOS/toolchain/linux/iphone/bin" || true

      - name: Build rootless DEB
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: LengLengLiquidNotice-DEB
          path: packages/*.deb
          if-no-files-found: error
